[project]
name = "capri-core"
version = "0.1.0"
description = "Capri agent daemon: reasoning, memory, tools, voice, screen"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=14.0",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "numpy>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capri_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
